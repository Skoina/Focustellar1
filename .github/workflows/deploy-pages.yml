name: Deploy Focustellar to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website files
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare production website
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$REPOSITORY_NAME" = "$REPOSITORY_OWNER.github.io" ]; then
            SITE_URL="https://${REPOSITORY_OWNER}.github.io"
          else
            SITE_URL="https://${REPOSITORY_OWNER}.github.io/${REPOSITORY_NAME}"
          fi

          if [ -f "index.html" ]; then
            SOURCE_DIR="."
          elif [ -f "FocustellarGitHubPages/index.html" ]; then
            SOURCE_DIR="FocustellarGitHubPages"
          else
            echo "Cannot find index.html"
            exit 1
          fi

          mkdir -p _site
          cp -R \
            "$SOURCE_DIR/index.html" \
            "$SOURCE_DIR/404.html" \
            "$SOURCE_DIR/robots.txt" \
            "$SOURCE_DIR/sitemap.xml" \
            "$SOURCE_DIR/llms.txt" \
            "$SOURCE_DIR/site.webmanifest" \
            "$SOURCE_DIR/assets" \
            _site/

          touch _site/.nojekyll

          sed -i "s|__SITE_URL__|${SITE_URL}|g" \
            _site/index.html \
            _site/404.html \
            _site/robots.txt \
            _site/sitemap.xml \
            _site/llms.txt \
            _site/site.webmanifest

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
